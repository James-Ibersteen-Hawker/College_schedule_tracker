<!DOCTYPE html>
<html>
    <head>
        <title>College Viewer</title>
    </head>
    <body>
        <main id="_vueapp">
            <form id="_classInput">
                <label for="name">Class Name</label>
                <input name="name" id="name" type="text" placeholder="Enter name here..." required><br>
                <label for="room">Class Room</label>
                <input name="room" id="room" type="text" placeholder="Enter room here..." required><br>
                <label for="teacher">Teacher</label>
                <input name="teacher" id="teacher" type="text" placeholder="Enter teacher here..." required><br>
                <label for="building">Building</label>
                <select id="buildings" required>
                </select><br>
                <input type="submit">
            </form>
        </main>
        <script type="module" src="script.js"></script>
    </body>
</html>
